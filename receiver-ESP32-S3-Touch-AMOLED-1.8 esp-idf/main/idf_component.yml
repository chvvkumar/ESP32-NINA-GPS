## IDF Component Manager Manifest File
version: "1.0.0"

dependencies:
  idf: ">=5.2.0"

  # ── LVGL 9 ─────────────────────────────────────────────────────────
  lvgl/lvgl:
    version: "~9.2"
    public: true

  # ── ESP LVGL port (display + touch integration for LVGL 9) ────────
  espressif/esp_lvgl_port:
    version: ">=2.0.0"
    public: true

  # ── Display driver (local component from 05_LVGL_WITH_RAM) ────────
  esp_lcd_sh8601:
    path: "../05_LVGL_WITH_RAM/components/esp_lcd_sh8601"
    version: "*"
    public: true

  # ── Touch driver ──────────────────────────────────────────────────
  esp_lcd_touch_ft5x06:
    path: "../05_LVGL_WITH_RAM/components/espressif__esp_lcd_touch_ft5x06"
    version: "*"
    public: true

  # ── IO expander (for backlight/reset on Waveshare board) ──────────
  espressif/esp_io_expander_tca9554:
    version: "^1.0.1"

  # ── Networking ────────────────────────────────────────────────────
  # esp_wifi is a core ESP-IDF component -- no registry entry needed.
  # esp_now is also built-in on ESP-IDF >=5.x for ESP32-S3.
  # Only declare them here if you want to pin a version from the
  # component registry (e.g. for out-of-tree esp_now versions).
  # Otherwise they are pulled in automatically via #include and
  # REQUIRES/PRIV_REQUIRES in the component CMakeLists.
